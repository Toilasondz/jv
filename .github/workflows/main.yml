name: Build VideoStar Macro Tool

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup iOS SDK & Theos Environment
        run: |
          echo "=== Installing Dependencies ==="
          brew install ldid cmake ninja

          echo "=== Setting up Theos ==="
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          echo "=== Downloading & Setting up iOS SDKs ==="
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          cp -R sdks-master/* $THEOS/sdks/
          rm -rf master.zip sdks-master

          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Compile Tweak (.dylib / .deb)
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarMacroTool-Build
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
          if-no-files-found: warn
